name: Build iOS IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Create web files
        run: |
          mkdir -p www
          echo '<!DOCTYPE html>' > www/index.html
          echo '<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Tijgerbol</title></head>' >> www/index.html
          echo '<body><script>window.location.href="https://ludwigdassler.github.io/tijgerbol_app/";</script></body></html>' >> www/index.html

      - name: Install PWA CLI
        run: npm install -g @pwabuilder/cli

      - name: Generate iOS project
        run: pwa create . --platform ios

      - name: Archive
        run: |
          cd platforms/ios
          xcodebuild -project Tijgerbol.xcodeproj -scheme Tijgerbol -archivePath Tijgerbol.xcarchive archive
          mkdir -p export
          xcodebuild -exportArchive -archivePath Tijgerbol.xcarchive -exportPath export -exportOptionsPlist exportOptions.plist

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Tijgerbol.ipa
          path: platforms/ios/export/*.ipa
