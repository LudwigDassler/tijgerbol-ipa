name: Build iOS IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Create www folder
        run: |
          mkdir -p www
          cp index.html www/
          cp manifest.json www/ || true
          
      - name: Install Capacitor
        run: |
          npm install -g @capacitor/cli
          npm install @capacitor/core @capacitor/ios
          
      - name: Create Capacitor project
        run: |
          npx cap init Tijgerbol com.tijgerbol.app --web-dir=www
          npx cap add ios
          
      - name: Update deployment target
        run: |
          cd ios/App
          # Обновляем минимальную версию iOS в Podfile
          cat > Podfile << 'PODFILE'
          platform :ios, '13.0'
          use_frameworks!
          target 'App' do
            capacitor_pods = true
            pod 'Capacitor', :path => '../../node_modules/@capacitor/ios'
          end
PODFILE
          # Обновляем версию в Xcode проекте
          sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = .*/IPHONEOS_DEPLOYMENT_TARGET = 13.0/g' App.xcodeproj/project.pbxproj
          
      - name: Sync and build
        run: |
          npx cap sync
          cd ios/App
          pod install --repo-update
          xcodebuild -project App.xcodeproj -scheme App -archivePath App.xcarchive archive
          xcodebuild -exportArchive -archivePath App.xcarchive -exportPath . -exportOptionsPlist exportOptions.plist
          
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Tijgerbol.ipa
          path: ios/App/*.ipa
