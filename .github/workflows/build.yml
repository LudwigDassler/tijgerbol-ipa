name: Build iOS IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Install Capacitor
        run: |
          npm install -g @capacitor/cli
          npm install @capacitor/core @capacitor/ios
          
      - name: Create Capacitor project
        run: |
          npx cap init Tijgerbol com.tijgerbol.app --web-dir=.
          npx cap add ios
          
      - name: Sync and build
        run: |
          npx cap sync
          cd ios/App
          pod install
          
      - name: Archive IPA
        run: |
          cd ios/App
          xcodebuild -project App.xcodeproj -scheme App -archivePath App.xcarchive archive
          xcodebuild -exportArchive -archivePath App.xcarchive -exportPath . -exportOptionsPlist exportOptions.plist
          
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Tijgerbol.ipa
          path: ios/App/*.ipa
